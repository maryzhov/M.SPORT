<style>
/* Layout: phone column (max 440px) centered; scrolling view + fixed bottom tab bar; overlays slide over the view. Dark-first. */
:root{
  --bg:#061113; --surface:#0b1c1f; --surface2:#11272a; --line:#1b3639;
  --fg:#e4f3f2; --muted:#7f9c9d; --accent:#2fe3d3; --accent-ink:#022320; --accent-soft:rgba(47,227,211,.12);
  --logo-red:#e5352d; --brand:#20c9b6; --brand-ink:#04211e; --logo-bg:transparent; --logo-pad:0; --good:#3ddc8c; --warn:#f2b544; --bad:#e5352d;
  --c-run:#2fe3d3; --c-gymrun:#5c9dff; --c-cycle:#ff8b4d; --c-futsal:#b27dff; --c-stretch:#f27ab3; --c-swim:#4cc3ff; --c-bike:#ffc04d; --c-rest:#6d8586; --c-other:#9aa9aa;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Unbounded","Onest",system-ui,sans-serif;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#edf5f4; --surface:#ffffff; --surface2:#e2eeed; --line:#cddfdd;
  --fg:#0a2326; --muted:#557274; --accent:#0a9f91; --accent-ink:#ffffff; --accent-soft:rgba(10,159,145,.1);
  --c-run:#0a9f91; --c-rest:#8aa0a1; --logo-bg:var(--brand); --logo-pad:.16em .2em .14em; color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#edf5f4; --surface:#ffffff; --surface2:#e2eeed; --line:#cddfdd;
  --fg:#0a2326; --muted:#557274; --accent:#0a9f91; --accent-ink:#ffffff; --accent-soft:rgba(10,159,145,.1);
  --c-run:#0a9f91; --c-rest:#8aa0a1; --logo-bg:var(--brand); --logo-pad:.16em .2em .14em; color-scheme:light;}
html:root.t-dark{
  --bg:#061113; --surface:#0b1c1f; --surface2:#11272a; --line:#1b3639;
  --fg:#e4f3f2; --muted:#7f9c9d; --accent:#2fe3d3; --accent-ink:#022320; --accent-soft:rgba(47,227,211,.12);
  --c-run:#2fe3d3; --c-rest:#6d8586; --logo-bg:transparent; --logo-pad:0; color-scheme:dark;}
html:root.t-light{
  --bg:#edf5f4; --surface:#ffffff; --surface2:#e2eeed; --line:#cddfdd;
  --fg:#0a2326; --muted:#557274; --accent:#0a9f91; --accent-ink:#ffffff; --accent-soft:rgba(10,159,145,.1);
  --c-run:#0a9f91; --c-rest:#8aa0a1; --logo-bg:var(--brand); --logo-pad:.16em .2em .14em; color-scheme:light;}

*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%}[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:440px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
h1{font:700 24px/1.15 var(--f-body);margin:0;text-wrap:balance}
h2{font:600 17px/1.2 var(--f-body);margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.logo{display:inline-flex;align-items:flex-end;font:900 30px/0.8 "Arial Black",var(--f-num);color:#fff;letter-spacing:-.04em;background:var(--logo-bg);padding:var(--logo-pad);border-radius:.2em;flex:none}
.logo.sm{font-size:22px}
.logo svg{height:.8em;width:auto;display:block}
.logo i{width:.3em;height:.3em;background:var(--logo-red);display:inline-block;margin-left:1px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn:hover{background:var(--surface2)}
.iconbtn.sm{width:32px;height:32px;border-radius:9px}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.sm svg.ic{width:18px;height:18px}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.tap{cursor:pointer;transition:border-color .15s;text-align:left;width:100%}
.card.tap:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.chev{color:var(--muted);display:inline-flex}
.week{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:11px;min-width:0}
.week .d b{font:600 16px var(--f-num)}
.week .d span{font-size:11.5px;color:var(--muted)}
.week .d.sel{background:var(--accent);color:var(--accent-ink)}
.week .d.sel span{color:var(--accent-ink)}
.week .d.today:not(.sel) b{color:var(--accent)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.week .arrow{width:28px;height:44px;display:grid;place-items:center;color:var(--muted);flex:none}
.hero{position:relative;overflow:hidden;padding:16px}
.hero .land{position:absolute;right:0;bottom:0;width:100%;height:100%;pointer-events:none}
.hero-in{position:relative;z-index:1}
.splash{position:fixed;inset:0;z-index:60;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff}
.splash .lg svg{width:150px;height:auto;display:block;color:#fff}
.lockup{display:block;height:auto}
.lockup text{font-family:"Onest",var(--f-body);font-weight:200;fill:#fff}
.splash .nm{font:700 15px var(--f-body);letter-spacing:.32em;opacity:.9;padding-left:.32em}
.splash .spin{border-color:#fff;border-right-color:transparent;width:22px;height:22px}
.auth{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.auth-top{background:var(--brand);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(44px + env(safe-area-inset-top,0px)) 24px 70px;border-radius:0 0 32px 32px}
.auth-top{position:relative;overflow:hidden}
.auth-top>*{position:relative;z-index:1}
.auth-top .deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.hv-b{padding-top:calc(30px + env(safe-area-inset-top,0px))!important;padding-bottom:60px!important}
.hv-c,.hv-d{min-height:46vh}
.hv-d{border-radius:0!important;min-height:58vh;padding-bottom:90px!important}
.auth-top .lg svg{width:96px;height:auto;display:block;color:#fff}
.auth-top h1{color:#fff;font-size:26px;letter-spacing:.06em}
.auth-top p{margin:0;opacity:.92;text-align:center;max-width:300px}
.auth-body{width:100%;max-width:440px;margin:-40px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;position:relative}
.auth .btn.pri{background:var(--brand);color:var(--brand-ink)}
.auth .seg button.on{background:var(--brand);color:var(--brand-ink)}
.auth .check.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.auth .card.tap[aria-pressed="true"]{border-color:var(--brand)!important}
.auth-body>.card:first-child,.auth-body>.seg:first-child{box-shadow:0 10px 30px rgba(0,0,0,.18)}
.tile{display:flex;flex-direction:column;align-items:stretch;min-width:0}
.tbig{font-size:26px;margin-top:8px;line-height:1.1}
.tbig small{font:500 13px var(--f-body);color:var(--muted)}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent);white-space:nowrap}
.badge.done{background:var(--accent);color:var(--accent-ink)}
.badge.demo{border-color:var(--line);color:var(--muted)}
.big{font:700 44px/1 var(--f-num);letter-spacing:-.03em}
.big small{font:600 22px var(--f-body);margin-left:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font-weight:600;font-size:16px;width:100%;padding:0 14px;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{border:1px solid var(--line);background:var(--surface2)}
.btn.dang{border:1px solid color-mix(in srgb,var(--bad) 60%,transparent);color:var(--bad)}
.btn.sm{min-height:38px;font-size:14px;border-radius:11px;width:auto}
.btn.ai{border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-soft);color:var(--accent)}
.ring{flex:none}
.ring .bgc{stroke:var(--line)} .ring .fgc{stroke:var(--accent);transition:stroke-dashoffset .5s}
.ring text{fill:var(--fg);font:600 15px var(--f-num)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:10px;font-size:14px;color:var(--muted);font-weight:500;padding:0 4px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.xs{min-height:32px;font-size:13px;padding:0 10px}
.chip .sw{width:9px;height:9px;border-radius:50%}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.tap{cursor:pointer}
.tic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:14px;height:14px;stroke:currentColor;stroke-width:3;fill:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;color:var(--muted)}
.inp{height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;width:100%;min-width:0;max-width:100%;font-size:16px}
input[type=date].inp,input[type=time].inp{-webkit-appearance:none;appearance:none;display:block;line-height:42px;text-align:left}
input[type=date].inp::-webkit-date-and-time-value{text-align:left}
textarea.inp{height:auto;min-height:76px;padding:10px 12px;resize:vertical}
select.inp{appearance:auto}
.inp:focus{outline:none;border-color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--logo-red);width:18px;height:18px;flex:none}
.stat b{display:block;font:600 19px var(--f-num)}
.stat span{font-size:12px;color:var(--muted)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--muted);min-width:0}
.tabbar button.on{color:var(--accent)}
.ov{position:fixed;inset:0;z-index:30;display:flex;justify-content:center;background:var(--bg)}
.ov .inner{width:100%;max-width:440px;overflow-y:auto;height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ovhead{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);z-index:2;padding-block:4px}
.ovhead h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11.5px;color:var(--muted);padding-bottom:4px}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 14px var(--f-num)}
.cal .c.out{opacity:.3}
.cal .c.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal .c.sel{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font:11px var(--f-body)}
.chart .val{fill:var(--fg);font:600 11px var(--f-num)}
.chart .barr{fill:var(--accent)}
.chart .barp{fill:var(--line)}
.chart .ln{stroke:var(--accent);stroke-width:2.2;fill:none}
.chart .area{fill:var(--accent-soft)}
.chart .tgt{stroke:var(--warn);stroke-dasharray:5 5;stroke-width:1.5}
.chart .dot{fill:var(--accent)}
.phase{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0}
.phase .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-num);background:var(--surface2);flex:none}
.phase.now .n{background:var(--accent);color:var(--accent-ink)}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.player .pp{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;color:var(--accent);flex:none}
.player .pp.on{background:var(--accent);color:var(--accent-ink)}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:var(--accent);border-radius:2px;height:30%}
.eq.on i{animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{to{height:100%}}
.cover{width:52px;height:52px;border-radius:12px;flex:none;background:var(--brand);display:grid;place-items:center;color:#fff;font:700 14px var(--f-num)}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.shots figure{margin:0;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2);min-height:60px}
.shots figure img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;cursor:zoom-in}
.shots figure.zoom{grid-column:1/-1}
.shots figure.zoom img{aspect-ratio:auto;object-fit:contain;cursor:zoom-out}
.shotdel{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--bad)}
.shotdel svg{width:18px;height:18px}
.stage{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.stage:first-child{border-top:0}
.stage .no{width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font:600 12px var(--f-num);flex:none;margin-top:10px}
.stage .ctr{display:flex;flex-direction:column;gap:2px;flex:none}
.timer{font:700 64px/1 var(--f-num);letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums}
.live-stage{text-align:center;padding:18px 14px}
.bigplay{width:88px;height:88px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto}
.bigplay svg.ic{width:36px;height:36px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.swatch.on{border-color:var(--fg)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.toggle{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:left .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:21px;background:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<!-- ===== НАСТРОЙКА: конфиг Firebase (Project settings → Your apps → Web). Аккаунты и данные — в Firebase ===== -->

function chunks(){

  const out={core:JSON.stringify(core)}, tmp={};
  S.workouts.forEach(w=>{ const k="w-"+w.date.slice(0,7); (tmp[k]=tmp[k]||[]).push(w); });
  Object.keys(S.food.days).forEach(d=>{ const k="f-"+d.slice(0,7); (tmp[k]=tmp[k]||{})[d]=S.food.days[d]; });

}

async function syncUp(){

    for(const k in SYNC.hash){ if(!(k in ch)){ await col.del(k); delete SYNC.hash[k]; } }

async function syncDown(){

    <div class="grid2" style="${CAP.sample?"":"grid-template-columns:1fr"}"><button class="btn sec" data-act="parseTxt">Распознать</button>${CAP.sample?`<button class="btn ai" data-act="aiFoodTxt" ${UI.ai.busy?"disabled":""}>${ic("spark")}Через ИИ</button>`:""}</div>
    ${CAP.sample?'<div class="small muted">«Распознать» ищет в базе продуктов. «Через ИИ» понимает любые блюда: «борщ со сметаной», «шаурма».</div>':""}${aiLine()}${resList(meal)}`;
  else if(mode==="photo"){ const ph=day.photos&&day.photos[meal], src=imgSrc(ph);
    b=`${src?`<img src="${src}" alt="Фото еды" style="width:100%;border-radius:14px;max-height:280px;object-fit:cover">`:""}
    <label class="btn ${src?"sec":"pri"}" for="foodPhoto" style="cursor:pointer">${ic("camera")}${src?"Заменить фото":"Сфотографировать или выбрать"}</label><input type="file" id="foodPhoto" accept="image/*" capture="environment" hidden>
    ${CAP.sampleImages?(src?`<button class="btn ai" data-act="aiFoodPhoto" ${UI.ai.busy?"disabled":""}>${ic("spark")}Распознать блюдо по фото</button><div class="small muted">ИИ оценит продукты и вес порции. Проверь результат и поправь размер.</div>`:""):`<div class="note">Распознавание по фото работает внутри Claude. Здесь фото сохранится в «${mealName(meal)}», продукты добавь текстом.</div>`}
    ${aiLine()}${resList(meal)}`;
  } else b=`<div class="card col"><div class="field"><label for="own-n">Название</label><input class="inp" id="own-n" placeholder="Рис с овощами (домашний)"></div><div class="flabel">На 100 г</div>
      <div class="kv"><div class="field"><label for="own-k">Калории</label><input class="inp" id="own-k" inputmode="decimal" placeholder="120"></div><div class="field"><label for="own-por">Обычная порция, г</label><input class="inp" id="own-por" inputmode="numeric" placeholder="200"></div></div>
      <div class="kv3"><div class="field"><label for="own-p">Белки</label><input class="inp" id="own-p" inputmode="decimal" placeholder="3"></div><div class="field"><label for="own-f">Жиры</label><input class="inp" id="own-f" inputmode="decimal" placeholder="2,5"></div><div class="field"><label for="own-c">Углеводы</label><input class="inp" id="own-c" inputmode="decimal" placeholder="22"></div></div>
      <button class="btn pri" data-act="saveOwn">Сохранить продукт</button></div>`;

  <div class="chips">${MEALS.map(([m,n])=>`<button class="chip ${meal===m?"on":""}" data-act="fmeal" data-m="${m}">${n}</button>`).join("")}</div>
  <div class="seg">${[["search","Поиск"],["text","Текстом"],["photo","Фото"],["own","Свой"]].map(([k,l])=>`<button class="${mode===k?"on":""}" data-act="fmode" data-mode="${k}">${l}</button>`).join("")}</div>${b}`; }
function fiOutHtml(p,g){ return `<div class="row between"><span class="muted">На ${g} г</span><b class="num" style="font-size:22px">${Math.round(p.k*g/100)} ккал</b></div><div class="small" style="margin-top:6px">Б ${fnum(p.p*g/100,1)} г · Ж ${fnum(p.f*g/100,1)} г · У ${fnum(p.c*g/100,1)} г</div>`; }
function vFoodItem(top){ const p=prodBy(top.pid); if(!p) return ovHead("Продукт"); const g=top.g;
  return `${ovHead(esc(p.n))}
  <div class="card"><div class="row" style="align-items:baseline;gap:6px"><span class="num" style="font-size:30px">${p.k}</span><span class="muted">ккал на 100 г</span></div><div class="small muted" style="margin-top:4px">Б ${p.p} · Ж ${p.f} · У ${p.c}${p.pc?` · 1 шт ≈ ${p.pc} г`:""}</div></div>
  <div class="card"><div class="row"><button class="iconbtn" style="border:1px solid var(--line)" data-act="fiStep" data-n="-10" aria-label="Меньше">−</button><input class="inp num" id="fiG" inputmode="numeric" value="${g}" style="text-align:center;font-size:20px;height:48px" aria-label="Граммы"><button class="iconbtn" style="border:1px solid var(--line)" data-act="fiStep" data-n="10" aria-label="Больше">${ic("plus")}</button><span class="muted">г</span></div>
    <div class="chips" style="margin-top:12px">${[...new Set([50,100,150,200,p.por].concat(p.pc?[p.pc]:[]))].sort((a,b)=>a-b).map(v=>`<button class="chip ${v===g?"on":""}" data-act="fiSet" data-g="${v}">${p.pc===v?"1 шт":v+" г"}</button>`).join("")}</div></div>
  <div class="card" id="fiOut">${fiOutHtml(p,g)}</div>
  <button class="btn pri" data-act="fiAdd">Добавить в «${mealName(top.meal)}»</button>
  ${p.mine?`<button class="btn dang" data-act="delOwn" data-pid="${p.id}">${ic("trash")}Удалить из моих продуктов</button>`:""}`; }
function vFoodAn(){
  const per=UI.anPer, G=S.food.goals, rows=[];
  for(let i=per-1;i>=0;i--){ const d=addD(TODAY,-i), t=sumN(fday(d).items); rows.push(Object.assign({d,l:per===7?DN[dow(d)]:String(parse(d).getDate()),v:t.k,cur:d===TODAY,w:waterOf(d)},t)); }
  const full=rows.filter(r=>r.k>0&&!r.cur), n=full.length||1, avg=k=>full.reduce((a,r)=>a+r[k],0)/n, dev=full.length?(avg("k")-G.k)/G.k*100:0;
  return `${ovHead("Аналитика питания")}
  <div class="seg"><button class="${per===7?"on":""}" data-act="anPer" data-n="7">7 дней</button><button class="${per===30?"on":""}" data-act="anPer" data-n="30">30 дней</button></div>
  <div class="card"><div class="row between"><h2>Калории</h2><span class="small muted">серый — сегодня</span></div>${barChart(rows,{target:G.k,tlabel:"цель "+G.k,min:G.k*1.2,label:"Калории по дням"})}</div>
  <div class="grid2"><div class="card stat"><b>${Math.round(avg("k"))}</b><span>ккал в среднем за день</span></div><div class="card stat"><b style="color:${dev<=0?"var(--good)":"var(--warn)"}">${dev>0?"+":""}${fnum(dev,0)}%</b><span>к цели ${G.k}</span></div></div>
  <div class="card col"><h2>БЖУ в среднем за день</h2>${macroBar("Белки",avg("p"),G.p,"var(--good)")}${macroBar("Жиры",avg("f"),G.f,"var(--warn)")}${macroBar("Углеводы",avg("c"),G.c,"var(--c-futsal)")}</div>
  <div class="card stat"><b>${fnum(avg("w")/1000,1)} л</b><span>воды в среднем за день, цель ${fnum(G.water/1000,1)} л</span></div>
  ${full.length<per-1?`<div class="note">Дни без записей не входят в средние.</div>`:""}`; }
function vFoodSet(){ const G=S.food.goals;
  const f=(id,l,v,u)=>`<div class="field"><label for="${id}">${l}</label><div class="row" style="gap:6px"><input class="inp" id="${id}" inputmode="numeric" value="${v}"><span class="small muted">${u}</span></div></div>`;
  return `${ovHead("Нормы питания")}
  <div class="card col"><h2>Цели на день</h2>${f("g-k","Калории",G.k,"ккал")}<div class="kv3">${f("g-p","Белки",G.p,"г")}${f("g-f","Жиры",G.f,"г")}${f("g-c","Углеводы",G.c,"г")}</div>${f("g-w","Вода",G.water,"мл")}</div>
  <div class="note">Расход = обмен по формуле Миффлина (вес, рост ${S.profile.height||"—"} см, возраст) × 1,3 + калории выполненных тренировок. Рост меняется в Профиле.</div>
  <button class="btn pri" data-act="saveGoals">Сохранить</button>`; }

    <button class="btn pri" data-act="planAdd">${ic("plus")}Добавить выбранные (${P0.res.filter(r=>r.on).length})</button>`:""}`; }

function contactRows(){ const C=CONTACTS, row=(href,icon,t,d)=>href?`<a class="li" href="${href}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="tile-ic">${ic(icon)}</span><span class="grow"><b style="font-weight:600;display:block">${t}</b><span class="small muted">${esc(d)}</span></span><span class="chev">${ic("chev")}</span></a>`:`<div class="li" style="opacity:.6"><span class="tile-ic">${ic(icon)}</span><span class="grow"><b style="font-weight:600;display:block">${t}</b><span class="small muted">Скоро появится</span></span></div>`;

function vContact(){ return `${ovHead("Связь с нами")}
  <div class="card"><div class="small muted" style="line-height:1.5">Идеи, ошибки, пожелания — пишите куда удобно. Скрин экрана с ошибкой очень помогает.</div><div class="list" style="margin-top:6px">${contactRows()}</div></div>
  <div class="card col" style="align-items:center;text-align:center"><b>QR-код Max</b><img src="${QR_MAX}" alt="QR-код для чата в Max" style="width:200px;height:200px;border-radius:14px;background:#fff"><div class="small muted">Отсканируй камерой телефона, чтобы написать в Max</div></div>
  <div class="card col"><h2>Предложить идею прямо здесь</h2><textarea class="inp" id="fb-txt" rows="4" placeholder="Что улучшить, чего не хватает, что неудобно"></textarea><button class="btn pri" data-act="fbSend">Отправить</button><div class="small muted">Сообщение сохранится в вашем аккаунте, команда M.SPORT его увидит.</div></div>
  <a class="card tap row" href="${GUIDE_URL}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="tile-ic">${ic("doc")}</span><div class="grow"><b>Инструкция по приложению</b><div class="small muted">PDF: что заполнять и как пользоваться</div></div><span class="chev">${ic("chev")}</span></a>`; }
const LEGAL = {
  terms:["Условия использования",`<p>M.SPORT — тестовая версия дневника тренировок, питания и веса. Приложение предоставляется бесплатно, «как есть», возможны ошибки и изменения.</p><p>Рекомендации приложения (нормы питания, нагрузки, планы) носят информационный характер и не заменяют консультацию врача или тренера. Перед интенсивными нагрузками проконсультируйтесь со специалистом.</p><p>Вы отвечаете за достоверность данных, которые вводите, и за сохранность пароля. Аккаунт и все данные можно удалить в Профиле.</p><p class="muted">Черновик для теста. Окончательный текст будет подготовлен с юристом до публичного запуска.</p>`],
  privacy:["Обработка персональных данных",`<p>Что собираем: имя, почту, данные, которые вы вносите сами (тренировки, питание, вес, рост, дата рождения, цели, фото и скрины).</p><p>Зачем: чтобы работал ваш личный кабинет — сохранять и показывать ваши записи на ваших устройствах. Данные не продаются и не передаются третьим лицам для рекламы.</p><p>Где хранятся: в облачной базе (Google Firebase). Доступ к записям есть только у вас по вашему логину.</p><p>Ваши права: посмотреть, выгрузить (Профиль → Экспорт) и удалить данные вместе с аккаунтом (Профиль → Удалить аккаунт). Согласие можно отозвать, удалив аккаунт.</p><p class="muted">Черновик для теста. Перед публичным запуском текст и место хранения данных будут приведены в соответствие с 152-ФЗ.</p>`]
};
function vLegal(top){ const L=LEGAL[top.id]||LEGAL.terms; return `${ovHead(L[0])}<div class="card" style="line-height:1.55">${L[1]}</div>`; }
const EN_LEVELS=[["A2","Начальный"],["B1","Средний"],["B2","Выше среднего"]], EN_TOPICS=[["run","Бег и спорт"],["daily","Повседневное"],["biz","Бизнес"],["travel","Путешествия"]];
function enState(){ S.english=S.english||{level:"B1",topic:"run",turns:[]}; return S.english; }

  if(!CAP.sample) return `${ovHead("Английский с ИИ")}<div class="note">ИИ-учитель работает в версии M.SPORT внутри Claude. На сайте появится вместе с ИИ-тренером.</div>`;

  <div class="card col" style="gap:10px"><div class="flabel">Уровень</div><div class="seg">${EN_LEVELS.map(([k,l])=>`<button class="${E.level===k?"on":""}" data-act="enLevel" data-v="${k}">${k} · ${l}</button>`).join("")}</div>
    <div class="flabel">Тема</div><div class="chips">${EN_TOPICS.map(([k,l])=>`<button class="chip xs ${E.topic===k?"on":""}" data-act="enTopic" data-v="${k}">${l}</button>`).join("")}</div></div>
  <div class="card col" style="gap:10px"><div class="row" style="gap:8px"><span class="tile-ic">${ic("music")}</span><b>Урок в наушники на пробежку</b></div><div class="small muted">10 фраз по теме: учитель говорит фразу по-английски, перевод и повтор. Запусти перед стартом и слушай на бегу.</div>
    <div class="grid2"><button class="btn ai sm" style="width:100%" data-act="enAudio" ${UI.ai.busy?"disabled":""}>${ic("play")}Новый урок</button><button class="btn sec sm" style="width:100%" data-act="enStop">${ic("stop")}Стоп</button></div>${E.audio&&E.audio.length?`<div class="small muted">${E.audio.length} фраз в уроке · <button class="small" style="color:var(--accent)" data-act="enReplay">повторить</button></div>`:""}</div>
  <div class="card col" style="gap:10px"><b>Разговор с учителем</b>
    ${T.length?`<div class="col" style="gap:8px">${T.map((t,i)=>`<div style="align-self:${t.role==="user"?"flex-end":"flex-start"};max-width:88%;background:${t.role==="user"?"var(--accent-soft)":"var(--surface2)"};border-radius:14px;padding:9px 12px;line-height:1.45">${esc(t.content).replace(/\n/g,"<br>")}${t.role==="assistant"?`<div><button class="small" style="color:var(--accent);padding:4px 0" data-act="enSay" data-i="${E.turns.length-T.length+i}">▶ послушать</button></div>`:""}</div>`).join("")}</div>`:`<div class="small muted">Напиши что-нибудь по-английски (или по-русски — учитель поможет перевести). Он ответит, исправит ошибки и задаст вопрос, чтобы разговор шёл дальше.</div>`}

const enRules = E => `You are a friendly English teacher for a Russian-speaking adult (${S.profile.name||"student"}), level ${E.level}. Topic: ${({run:"running, training and sport",daily:"everyday life",biz:"business and work",travel:"travel"})[E.topic]}. Reply in simple English for this level, 2–4 sentences, then always ask one follow-up question. If the student made mistakes, add a new line starting with "✍️ " and list the corrections briefly in Russian (wrong → right). If the student wrote in Russian, help them say it in English. No markdown.`;
async function enSend(){ const E=enState(), txt=($("#en-txt").value||"").trim(); if(!txt){ toast("Напиши сообщение"); return; }
  E.turns.push({role:"user",content:txt}); save(); aiBusy(true,"Учитель отвечает…");
  try{ const hist=E.turns.slice(-16); const {text}=await CAP.sample([{role:"user",content:enRules(E)},...hist],{modelTier:"quick",cache:false});
    E.turns.push({role:"assistant",content:text.trim()}); save(); aiBusy(false); say(text.split("✍️")[0],"en-US"); const i=$("#ov .inner"); if(i) i.scrollTop=i.scrollHeight; }
  catch(e){ E.turns.pop(); aiFail(e); } }
async function enAudio(){ const E=enState(); aiBusy(true,"Готовлю урок…");
  try{ const r=await aiJSON(`Make a short audio English lesson for a Russian-speaking runner, level ${E.level}, topic: ${({run:"running and training",daily:"everyday life",biz:"business",travel:"travel"})[E.topic]}. Return only JSON array of 10 objects {"en":"useful natural phrase","ru":"перевод по-русски"}. Phrases should be practical, different, 4–10 words.`,null,"quick");
    E.audio=(Array.isArray(r)?r:[]).filter(x=>x&&x.en).slice(0,10); save(); aiBusy(false); playLesson(E.audio); }catch(e){ aiFail(e); } }
function playLesson(arr){ hush(); arr.forEach((x,i)=>{ say("Фраза "+(i+1)); say(x.en,"en-US"); say(x.ru); say(x.en,"en-US"); }); toast("Урок играет — можно бежать"); }

/* ================= render ================= */
function tabsFor(){ const F=S.settings.focus, tr=["train","Тренировки","run"], fd=["food","Питание","food"];
  return [["home","Главная","home"]].concat(!F.train&&F.food?[fd,tr]:[tr,fd]).concat([["progress","Прогресс","stats"],["profile","Профиль","user"]]); }
function render(){
  if(AUTH.mode==="fb"&&(!AUTH.ready||!AUTH.user||!S)){ applyTheme();
    $("#app").innerHTML = !AUTH.ready||(AUTH.user&&!S) ? splashHtml() : vLogin(); renderOv(); return; }
  applyTheme();
  if(S.onboarded===false){ $("#ov").innerHTML=""; $("#app").innerHTML=vWelcome(); return; }
  const tabs=tabsFor(); if(!tabs.some(t=>t[0]===UI.tab)) UI.tab="home";
  const V={progress:vProgress,home:vHome,train:vTrain,goals:()=>vGoals(false),food:()=>vFood(false),cal:()=>`<div class="top"><h1>Календарь</h1><div class="row" style="gap:6px">${LOGO}</div></div>${calendar()}`,stats:vStats,profile:vProfile};
  $("#app").innerHTML=`<main class="view">${V[UI.tab]()}</main><nav class="tabbar">${tabs.map(([k,l,i])=>`<button class="${UI.tab===k?"on":""}" data-act="tab" data-t="${k}" ${UI.tab===k?'aria-current="page"':""}>${ic(i)}<span>${l}</span></button>`).join("")}</nav>`;
  renderOv(); }
const OV = {workout:vWorkout,goals:()=>vGoals(true),goal:vGoal,goalEdit:vGoalEdit,weight:vWeight,food:()=>vFood(true),foodAdd:vFoodAdd,foodItem:vFoodItem,foodAn:vFoodAn,foodSet:vFoodSet,
  english:vEnglish,contact:vContact,legal:vLegal,libPick:vLibPick,ex:vEx,live:vLive,music:vMusic,records:vRecords,planImport:vPlanImport};
const ovKey = t => [t.v,t.id||"",t.sub||"",t.mode||""].join("|");
function renderOv(){
  const top=UI.stack[UI.stack.length-1], el=$("#ov");
  if(!top){ el.innerHTML=""; el.dataset.k=""; document.body.style.overflow=""; return; }
  const inner=el.querySelector(".inner"), sc=inner?inner.scrollTop:0, same=el.dataset.k===ovKey(top);
  el.innerHTML=`<div class="ov" role="dialog" aria-modal="true"><div class="inner">${(OV[top.v]||(()=>ovHead("…")))(top)}</div></div>`;
  el.dataset.k=ovKey(top); if(same) el.querySelector(".inner").scrollTop=sc;
  document.body.style.overflow="hidden"; }
const pushOv = o => { UI.stack.push(o); renderOv(); const i=$("#ov .inner"); if(i) i.scrollTop=0; };
const topS = () => UI.stack[UI.stack.length-1];
const curW = () => { for(let i=UI.stack.length-1;i>=0;i--){ const t=UI.stack[i]; if(t.v==="workout") return S.workouts.find(w=>w.id===t.id); } return null; };
const closeTo = v => { while(UI.stack.length&&topS().v!==v) UI.stack.pop(); };
const closeFood = () => { UI.stack=UI.stack.filter(x=>x.v!=="foodAdd"&&x.v!=="foodItem"); render(); };
function setPath(obj,path,val){ const p=path.split("."); let o=obj; for(let i=0;i<p.length-1;i++){ o[p[i]]=o[p[i]]||{}; o=o[p[i]]; } o[p[p.length-1]]=val; }
const getPath = (obj,path) => path.split(".").reduce((o,k)=>o==null?o:o[k],obj);
function exAdd(wid,e){ const w=S.workouts.find(x=>x.id===wid); if(!w) return; w.plan.stages.push(st(e.n,exSummary(e)+(e.desc?" — "+e.desc:""))); save(); }

/* ================= events ================= */
async function onAct(el,e){
  const a=el.dataset.act, d=el.dataset;
  switch(a){
    case "hvNext": { const n={a:"b",b:"c",c:"d",d:"a"}[HV()]; try{ localStorage.setItem("m.hv",n); }catch(e){} render(); toast("Шапка: вариант "+n.toUpperCase()); break; }
    case "fbSend": { const t=($("#fb-txt").value||"").trim(); if(!t){ toast("Напиши пару слов"); break; } S.feedback=S.feedback||[]; S.feedback.push({at:new Date().toISOString(),text:t}); save(); $("#fb-txt").value=""; toast("Спасибо! Сообщение сохранено"); break; }
    case "delAccount": { if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="Точно удалить? Данные не восстановить. Нажми ещё раз"; break; }
      try{ clearTimeout(SYNC.timer); const keys=Object.keys(SYNC.hash); for(const k of keys){ try{ await CAP.remote.del(k); }catch(e){} } const u=firebase.auth().currentUser; try{ localStorage.removeItem(KEY_CUR); }catch(e){} await u.delete(); toast("Аккаунт удалён"); }
      catch(err){ toast(err&&err.code==="auth/requires-recent-login"?"Для удаления выйди и войди заново, затем повтори":"Не получилось удалить аккаунт"); } break; }
    case "enSend": await enSend(); break;
    case "enReset": enState().turns=[]; save(); renderOv(); break;
    case "enLevel": enState().level=d.v; save(); renderOv(); break;
    case "enTopic": enState().topic=d.v; save(); renderOv(); break;
    case "enAudio": say(" "); await enAudio(); renderOv(); break;
    case "enReplay": playLesson(enState().audio||[]); break;
    case "enStop": hush(); break;
    case "enSay": { const t=enState().turns[+d.i]; if(t) say(t.content.split("✍️")[0],"en-US"); break; }
    case "togglePw": { const pi=$("#au-pass"); AUTH.f=AUTH.f||{}; if(pi) AUTH.f.pass=pi.value; AUTH.showPw=!AUTH.showPw; render(); const n=$("#au-pass"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } break; }
    case "authGoogle": { if(!FB_MODE){ toast("Вход через Google работает на сайте"); break; } const fa=firebase.auth(), pr=new firebase.auth.GoogleAuthProvider(); AUTH.err="";
      try{ const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||navigator.standalone; if(ios) await fa.signInWithRedirect(pr); else await fa.signInWithPopup(pr); }
      catch(err){ AUTH.err = err&&err.code==="auth/operation-not-allowed"?"Вход через Google ещё не включён — скоро заработает":err&&err.code==="auth/popup-closed-by-user"?"":(FB_ERR[err&&err.code]||"Не получилось войти через Google"); render(); } break; }
    case "authTab": AUTH.tab=d.t; AUTH.err=""; AUTH.info=""; render(); break;
    case "authReset": await authAct("reset"); break;
    case "logout": { if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="Точно выйти? Нажми ещё раз"; break; } clearTimeout(SYNC.timer); try{ await syncUp(); }catch(err){} await firebase.auth().signOut(); break; }
    case "pwReset": { try{ await firebase.auth().sendPasswordResetEmail(AUTH.user.email); toast("Ссылка для смены пароля — на "+AUTH.user.email); }catch(err){ toast("Не получилось отправить письмо"); } break; }
    case "progSeg": UI.progSeg=d.s; render(); break;
    case "tab": if(d.seg) UI.progSeg=d.seg; UI.tab=d.t; UI.stack=[]; stopLive(); render(); window.scrollTo(0,0); break;
    case "push": { const o={v:d.v}; if(d.id) o.id=d.id; if(d.for!==undefined) o.for=d.for||""; if(d.v==="ex"&&!d.id) o.for=d.for||""; pushOv(o); break; }
    case "pop": { const t=UI.stack.pop(); if(t&&t.v==="live"){ stopLive(); } render(); break; }
    case "pickDay": UI.day=d.d; render(); break;
    case "calPick": UI.day=d.d; UI.weekOf=monday(d.d); render(); break;
    case "wkShift": UI.weekOf=addD(UI.weekOf,+d.n); UI.day = UI.weekOf<=TODAY&&TODAY<=addD(UI.weekOf,6)?TODAY:UI.weekOf; render(); break;
    case "calShift": { const [y,m]=UI.calMonth.split("-").map(Number); UI.calMonth=iso(new Date(y,m-1+(+d.n),1)).slice(0,7); render(); break; }
    case "tseg": UI.trainSeg=d.s; render(); break;
    case "tplSeg": UI.tplSeg=d.s; render(); break;
    case "libSeg": UI.libSeg=d.s; render(); break;
    case "goalSeg": UI.goalSeg=d.s; render(); break;
    case "sper": UI.statPer=d.p; render(); break;
    case "openW": e.stopPropagation(); pushOv({v:"workout",id:d.id,sub:d.sub||"plan"}); break;
    case "toggleDone": { e.stopPropagation(); const w=S.workouts.find(x=>x.id===d.id); w.done=!w.done; if(w.done&&!w.fact.km&&w.plan.km) w.fact.km=w.plan.km; save(); render(); toast(w.done?"Отмечено выполненной":"Снята отметка"); break; }
    case "addW": { const w=mkW({date:d.d||UI.day}); S.workouts.push(w); save(); render(); pushOv({v:"workout",id:w.id,sub:"plan"}); break; }
    case "useTpl": { const t=S.templates.concat(READY_TPL).find(x=>x.id===d.id); const w=mkW({date:UI.day,type:t.type,title:t.n,plan:Object.assign({},t.plan,{stages:(t.plan.stages||[]).map(s=>Array.isArray(s)?st(s[0],s[1]):st(s.n,s.s))})}); S.workouts.push(w); save(); toast("Добавлено на "+human(UI.day)); render(); break; }
    case "delTpl": S.templates=S.templates.filter(t=>t.id!==d.id); save(); render(); toast("Шаблон удалён"); break;
    case "saveTpl": { const w=curW(); S.templates.unshift({id:nid(),n:wTitle(w),type:w.type,plan:JSON.parse(JSON.stringify(Object.assign({},w.plan,{stages:w.plan.stages.map(s=>[s.n,s.s])})))}); save(); toast("Сохранено в «Мои шаблоны»"); break; }
    case "dupW": { const w=curW(); const c=mkW(JSON.parse(JSON.stringify({type:w.type,title:w.title,plan:w.plan}))); c.id=nid(); c.date=addD(w.date,7); c.plan.stages=c.plan.stages.map(s=>st(s.n,s.s)); S.workouts.push(c); save(); UI.stack.pop(); render(); pushOv({v:"workout",id:c.id,sub:"plan"}); toast("Копия на "+human(c.date)+" — поменяй дату, если нужно"); break; }
    case "copyWeek": { const m=UI.weekOf; let n=0; for(let i=0;i<7;i++) byDate(addD(m,i)).forEach(w=>{ const c=mkW(JSON.parse(JSON.stringify({type:w.type,title:w.title,plan:w.plan}))); c.date=addD(w.date,7); c.plan.stages=c.plan.stages.map(s=>st(s.n,s.s)); S.workouts.push(c); n++; }); save(); UI.weekOf=addD(m,7); UI.day=UI.weekOf; render(); toast(n?"Скопировано тренировок: "+n:"На этой неделе нечего копировать"); break; }
    case "sub": { const t=topS(); t.sub=d.s; renderOv(); $("#ov .inner").scrollTop=0; break; }
    case "setv": { const w=curW(); if(!w) break; const cur=getPath(w,d.k); setPath(w,d.k, String(cur)===d.v && d.k!=="type" ? "" : d.v); save(); renderOv(); break; }
    case "finish": { const w=curW(); w.done=true; save(); closeTo("workout"); UI.stack.pop(); render(); toast("Тренировка сохранена"); break; }
    case "delW": { if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.style.color="var(--bad)"; toast("Нажми ещё раз, чтобы удалить"); setTimeout(()=>{ el.dataset.confirm=""; el.style.color=""; },2500); break; }
      const w=curW(); S.workouts=S.workouts.filter(x=>x!==w); save(); UI.stack.pop(); render(); toast("Удалено"); break; }
    case "stAdd": { const w=curW(); w.plan.stages.push(st("Этап "+(w.plan.stages.length+1),"")); save(); renderOv(); break; }
    case "stDel": { const w=curW(); w.plan.stages.splice(+d.i,1); save(); renderOv(); break; }
    case "stMove": { const w=curW(), s=w.plan.stages, i=+d.i, j=i+(+d.n); if(j<0||j>=s.length) break; [s[i],s[j]]=[s[j],s[i]]; save(); renderOv(); break; }
    case "exAdd": { const e2=S.library.find(x=>x.id===d.id)||STD_EX.find(x=>x.id===d.id); exAdd(d.for,e2); closeTo("workout"); renderOv(); toast("Этап добавлен: "+e2.n); break; }
    case "exCat": { const t=topS(); t.draft.cat=d.t; renderOv(); break; }
    case "exParam": { const t=topS(); t.draft.param=d.p; renderOv(); break; }
    case "exSetAdd": { const t=topS(); t.draft.v.sets.push(["","3","10"]); renderOv(); break; }
    case "exSetDel": { const t=topS(); t.draft.v.sets.splice(+d.i,1); renderOv(); break; }
    case "exSave": { const t=topS(), x=t.draft; if(!x.n.trim()){ toast("Назови упражнение"); break; }
      const clean={id:x._mine?x._srcId:nid(),n:x.n.trim(),cat:x.cat,param:x.param,v:x.v,desc:x.desc||""};
      const i=S.library.findIndex(y=>y.id===clean.id); if(i>=0) S.library[i]=clean; else S.library.unshift(clean); save();

async function aiFood(text,blob){
  aiBusy(true, blob?"Смотрю на фото…":"Разбираю описание…");
  try{ const r=await aiJSON(`${blob?"На фото — приём пищи. Определи все продукты и блюда на тарелке и оцени вес каждой порции по фото.":"Описание приёма пищи: "+text.slice(0,4000)+"\nЕсли вес не указан — возьми обычную порцию для взрослого."}
Верни только JSON-массив объектов {"name":"название по-русски","grams":число,"kcal":число,"p":белки г,"f":жиры г,"c":углеводы г} — значения на всю порцию, реалистичные.`, blob?[blob]:null, "default");
    const arr=(Array.isArray(r)?r:[]).filter(x=>x&&x.name&&+x.grams>0);
    UI.textRes=arr.map(x=>{ const g=+x.grams; return {raw:x.name,n:String(x.name),g,k:(+x.kcal||0)/g*100,p:(+x.p||0)/g*100,f:(+x.f||0)/g*100,c:(+x.c||0)/g*100,size:1,fixed:false,ai:true}; });
    aiBusy(false); if(!arr.length) toast("ИИ не нашёл еду — опиши текстом");
  }catch(err){ aiFail(err); } }

  if(t.id==="tracks"&&t.files.length){ [...t.files].forEach(f=>UI.tracks.push({name:f.name.replace(/\.[^.]+$/,""),url:URL.createObjectURL(f)})); renderOv(); toast("Добавлено треков: "+t.files.length); return; }
  if(t.id==="impFile"&&t.files[0]){ try{ const data=JSON.parse(await t.files[0].text()); if(!data||!Array.isArray(data.workouts)) throw 0; S=migrate(data); save(); render(); toast("Данные загружены"); }catch(err){ toast("Это не файл экспорта приложения"); } return; }
  if(t.id==="gpx"&&t.files[0]){ try{ const x=new DOMParser().parseFromString(await t.files[0].text(),"application/xml"), pts=[...x.getElementsByTagName("trkpt")];
      if(pts.length<2) throw 0; let dist=0; const R=6371, rad=v=>v*Math.PI/180;
      for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i], la1=rad(+a.getAttribute("lat")),la2=rad(+b.getAttribute("lat")),dl=rad(+b.getAttribute("lon")-+a.getAttribute("lon")),dL=la2-la1, h=Math.sin(dL/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dl/2)**2; dist+=2*R*Math.asin(Math.sqrt(h)); }
      const tm=pts.map(p=>p.getElementsByTagName("time")[0]?.textContent).filter(Boolean), w=curW();
      w.fact.km=String(Math.round(dist*100)/100); if(tm.length>1) w.fact.time=fmtT((new Date(tm[tm.length-1])-new Date(tm[0]))/1000);
      const hrs=[...x.getElementsByTagNameNS("*","hr")].map(n=>+n.textContent).filter(Boolean); if(hrs.length) w.fact.hr=String(Math.round(hrs.reduce((s,v)=>s+v,0)/hrs.length));
      if(!w.before.start&&tm[0]){ const d0=new Date(tm[0]); w.before.start=pad(d0.getHours())+":"+pad(d0.getMinutes()); }
      w.fact.approx=false; save(); renderOv(); toast("Загружено: "+fnum(dist,2)+" км"); }catch(err){ toast("Не получилось прочитать файл. Нужен .gpx с треком"); } return; }
});

render();
initCaps();
})();
